name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log

      - name: Ringkasan error
        if: failure()
        run: |
          echo "===== ERROR KOTLIN =====" 
          grep '^e: ' build.log | sed 's|file:///home/runner/work/[^/]*/[^/]*/app/src/main/java/com/example/paintdroid/||' | head -40 | tee errors.txt
          { echo '## Error kompilasi'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ChartDroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
